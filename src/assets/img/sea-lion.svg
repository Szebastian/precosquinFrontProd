<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0.7" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fc4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a6fc4" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Body shading -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#6b3410"/>
    </linearGradient>
    <!-- Belly highlight -->
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d2691e"/>
      <stop offset="100%" stop-color="#cd853f"/>
    </linearGradient>
    <!-- Fur texture -->
    <filter id="furTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#8b4513" surfaceScale="0.8" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="0.8" k2="0.2" k3="0" k4="0"/>
    </filter>
  </defs>
  
  <!-- Water surface -->
  <path fill="url(#waterGrad)" d="M0,320 Q150,310 300,325 Q450,340 600,315 L600,420 L0,420 Z"/>
  
  <!-- Body - torpedo shape, thick in middle -->
  <path fill="#8b4513" d="
    M 200,280
    C 220,240 260,210 300,200
    C 340,190 380,195 420,210
    L 450,230
    C 470,245 480,270 480,300
    L 480,330
    C 480,350 470,370 450,380
    L 400,395
    C 350,405 300,410 250,405
    L 200,390
    C 170,375 150,350 150,320
    Z"/>

  <!-- Belly - lighter tan -->
  <path fill="#cd853f" d="
    M 220,320
    C 230,300 250,285 275,278
    L 300,275
    C 330,272 360,278 385,290
    L 420,310
    C 440,325 450,345 450,365
    L 450,385
    C 440,395 425,402 410,405
    L 270,408
    C 245,408 225,398 215,380
    Z"/>

  <!-- Head - rounded, prominent -->
  <path fill="#8b4513" d="
    M 150,290
    C 150,260 160,235 180,220
    C 200,205 225,200 250,205
    C 270,208 285,215 295,225
    L 300,260
    C 300,280 290,300 275,310
    L 220,320
    C 185,325 160,315 150,290
    Z"/>

  <!-- Snout - pointed, characteristic of sea lions -->
  <path fill="#6b3410" d="
    M 120,285
    C 110,280 105,275 108,270
    C 112,265 120,262 130,265
    L 150,275
    C 155,278 155,285 150,290
    Z"/>

  <!-- Nose -->
  <ellipse fill="#1a1a2e" cx="115" cy="272" rx="6" ry="5"/>

  <!-- Whiskers (vibrissae) - long, prominent -->
  <line stroke="#1a1a2e" stroke-width="1.5" x1="125" y1="280" x2="80" y2="275"/>
  <line stroke="#1a1a2e" stroke-width="1.5" x1="128" y1="285" x2="75" y2="288"/>
  <line stroke="#1a1a2e" stroke-width="1.5" x1="130" y1="290" x2="78" y2="300"/>
  <line stroke="#1a1a2e" stroke-width="1.5" x1="132" y1="295" x2="82" y2="312"/>
  <line stroke="#1a1a2e" stroke-width="1.5" x1="125" y1="278" x2="70" y2="265"/>
  <line stroke="#1a1a2e" stroke-width="1.5" x1="127" y1="282" x2="72" y2="275"/>

  <!-- Eye - large, dark -->
  <ellipse fill="#1a1a2e" cx="165" cy="258" rx="7" ry="6"/>
  <circle fill="#2a2a4a" cx="165" cy="258" r="4"/>
  <circle fill="#ffffff" cx="163" cy="256" r="1.5"/>

  <!-- External ear flap (pinnae) - KEY FEATURE distinguishing sea lions from seals -->
  <path fill="#6b3410" d="
    M 175,245
    C 180,240 185,238 188,242
    C 191,246 188,252 183,255
    C 178,258 172,255 175,245"/>

  <!-- Front flippers - LONG, wing-like (sea lions can rotate them) -->
  <path fill="#7a3c12" d="
    M 280,310
    C 290,320 295,340 290,360
    C 285,380 270,395 250,400
    C 230,405 215,395 210,380
    C 205,365 210,345 220,330
    C 230,315 255,305 280,310"/>
  
  <!-- Flipper highlight -->
  <path fill="#8b4513" d="
    M 282,315
    C 290,325 293,342 289,358
    C 285,372 275,385 260,390
    C 248,394 238,388 235,378
    C 232,368 238,352 248,340
    C 258,328 272,318 282,315"/>

  <!-- Hind flippers - smaller, fan-shaped -->
  <path fill="#7a3c12" d="
    M 420,370
    C 430,365 445,358 460,350
    C 470,345 478,348 475,355
    C 472,362 460,370 445,378
    C 435,383 425,380 420,370"/>
  
  <path fill="#7a3c12" d="
    M 415,380
    C 425,385 440,392 455,400
    C 465,405 470,412 465,415
    C 460,418 448,415 435,408
    C 425,402 418,395 415,380"/>

  <!-- Neck/mane area (thicker fur on males) -->
  <path fill="#6b3410" d="
    M 200,250
    C 210,240 225,235 240,238
    C 250,240 258,245 260,255
    L 255,270
    C 248,280 235,285 220,285
    C 205,285 195,275 195,265
    Z"/>

  <!-- Body fur texture lines -->
  <path fill="none" stroke="#6b3410" stroke-width="1" opacity="0.4" d="
    M 250,230 C 260,240 270,260 275,280"/>
  <path fill="none" stroke="#6b3410" stroke-width="1" opacity="0.4" d="
    M 300,220 C 310,230 320,250 325,270"/>
  <path fill="none" stroke="#6b3410" stroke-width="1" opacity="0.4" d="
    M 350,225 C 360,235 370,255 375,275"/>

  <!-- Belly button scar -->
  <ellipse fill="#6b3410" cx="320" cy="350" rx="4" ry="3"/>

  <!-- Water surface reflection -->
  <path fill="#1a6fc4" opacity="0.2" d="
    M 150,330
    C 200,325 250,328 300,332
    C 350,336 400,330 450,328
    L 450,332
    C 400,334 350,340 300,336
    C 250,332 200,329 150,334"/>

  <!-- Water ripples -->
  <path fill="none" stroke="#1a6fc4" stroke-width="1" opacity="0.3" d="
    M 100,340 Q200,335 300,342 Q400,349 500,340"/>
  <path fill="none" stroke="#1a6fc4" stroke-width="1" opacity="0.2" d="
    M 80,350 Q180,345 280,352 Q380,359 480,350"/>
</svg>